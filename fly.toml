# fly.toml app configuration file generated for tekbot on 2026-08-27T12:10:15Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'tekbot'
primary_region = 'ams'

[build]
  builder = 'paketobuildpacks/builder:base'

[env]
  DB_PATH = '/data/duty.db'
  PYTHONUNBUFFERED = '1'

[processes]
  app = 'python tekbot.py'

[[mounts]]
  source = 'duty_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
